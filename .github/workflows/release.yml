name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      id-token: write
      contents: write
    env:
      # PyPI publishing is opt-in: with no PYPI_API_TOKEN the publish action
      # falls back to OIDC trusted publishing, which is not configured for this
      # project either, so it failed every release. Gate the step instead.
      HAS_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN != '' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install python-semantic-release

    - name: Verify tests pass
      run: |
        pytest

    - name: Python Semantic Release
      id: release
      uses: python-semantic-release/python-semantic-release@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Build package
      if: steps.release.outputs.released == 'true'
      run: |
        python -m build

    # GitHub Release first: it needs no external credentials, so a missing or
    # misconfigured PyPI setup no longer skips it.
    - name: Publish GitHub Release
      if: steps.release.outputs.released == 'true'
      uses: python-semantic-release/upload-to-gh-release@main
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        path: dist/*

    - name: Publish to PyPI
      if: steps.release.outputs.released == 'true' && env.HAS_PYPI_TOKEN == 'true'
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}

    - name: Note skipped PyPI publish
      if: steps.release.outputs.released == 'true' && env.HAS_PYPI_TOKEN != 'true'
      run: |
        echo "::notice::PyPI publish skipped - no PYPI_API_TOKEN secret is set." \
             "Add one (or configure a PyPI trusted publisher) to enable it."
